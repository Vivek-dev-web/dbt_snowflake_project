name: 'dbt_practice'
version: '1.0.0'
config-version: 2

profile: 'dbt_practice'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  dbt_practice:
    staging:
      +schema: STAGING
      +materialized: view
    marts:
      core:
        +schema: CORE
        +materialized: table
      hr:
        +schema: HR
        +materialized: table
